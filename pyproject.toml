[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fx-fundamental-technical-engine"
version = "0.1.0"
description = "Point-in-time fundamental bias and mechanical FX execution research"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "MetaTrader5==5.0.6180; platform_system == 'Windows'",
  "numpy==2.5.3",
  "openpyxl==3.1.5",
  "pandas==3.0.5",
  "pyarrow==25.0.1",
  "scipy==1.18.1",
  "statsmodels==0.15.0",
]

[project.scripts]
fx-hybrid = "fx_fundamental_technical.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "ruff>=0.7,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
pretty = true
show_error_codes = true
